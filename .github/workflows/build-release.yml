name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build ${{ matrix.loader }}
        run: gradle -p ${{ matrix.loader }} clean build --stacktrace
      - name: Collect runtime jar
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.loader }}" = "fabric" ]; then
            cp fabric/build/libs/random-keys-survival-fabric-0.3.0.jar dist/
          else
            cp forge/build/libs/random-keys-survival-forge-0.3.0.jar dist/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: random-keys-${{ matrix.loader }}
          path: dist/*.jar
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: random-keys-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v$(cat VERSION)-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Random Keys Survival $(cat VERSION) (build ${GITHUB_RUN_NUMBER})" \
            --notes "Minecraft 1.20.1 Fabric + Forge. One enabled mapping changes per damage; keypad keys and Unbound are valid results; layouts persist across reconnects and rotate every 3 minutes; mouse-wheel hotbar switching is blocked; non-survival modes require /!c maintenance bypass; keepInventory is forced off; zh_tw/zh_cn/en_us localization included."
