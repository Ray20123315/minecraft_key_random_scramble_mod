name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: Check whether VERSION changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- VERSION; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build ${{ matrix.loader }}
        run: gradle -p ${{ matrix.loader }} clean build --stacktrace
      - name: Collect runtime jar
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          LOADER="${{ matrix.loader }}"
          SOURCE="${LOADER}/build/libs/random-keys-survival-${LOADER}-${VERSION}.jar"
          test -f "$SOURCE" || {
            echo "::error::Expected runtime JAR not found: $SOURCE"
            find "${LOADER}/build/libs" -maxdepth 1 -type f -print || true
            exit 1
          }
          mkdir -p dist
          cp "$SOURCE" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: random-keys-${{ matrix.loader }}
          path: dist/*.jar
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: random-keys-*
          path: dist
          merge-multiple: true
      - name: Validate version-scoped Release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          notes = Path(f".github/release-notes/{version}.md")
          if not notes.is_file():
              sys.exit(f"Missing {notes}. Copy TEMPLATE.md and describe only this version's added features/fixes.")

          text = notes.read_text(encoding="utf-8")
          lines = text.splitlines()
          nonempty = [line.strip() for line in lines if line.strip()]
          expected_marker = f"<!-- VERSION: {version} -->"
          if not nonempty or nonempty[0] != expected_marker:
              sys.exit(f"{notes} must start with {expected_marker}")

          required_h2 = ["## 繁體中文", "## 简体中文", "## English"]
          actual_h2 = [line.strip() for line in lines if line.startswith("## ")]
          if actual_h2 != required_h2:
              sys.exit(f"Release notes must contain exactly these H2 sections in order: {required_h2}")

          allowed_h3 = {
              "## 繁體中文": {"### 新增功能", "### 修復"},
              "## 简体中文": {"### 新增功能", "### 修复"},
              "## English": {"### Added", "### Fixed"},
          }

          h2_indexes = [lines.index(section) for section in required_h2]
          h2_indexes.append(len(lines))
          for i, section in enumerate(required_h2):
              chunk = lines[h2_indexes[i] + 1:h2_indexes[i + 1]]
              headings = [line.strip() for line in chunk if line.startswith("### ")]
              if not headings:
                  sys.exit(f"{section} must contain Added/Fixed change categories")
              unexpected = [heading for heading in headings if heading not in allowed_h3[section]]
              if unexpected:
                  sys.exit(f"Unexpected subsection(s) in {section}: {unexpected}. Only added/fixed categories are allowed.")
              if not any(re.match(r"^-\s+\S", line.strip()) for line in chunk):
                  sys.exit(f"{section} must contain at least one bullet describing an added feature or fix")
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          NOTES_FILE=".github/release-notes/${VERSION}.md"
          gh release create "$TAG" dist/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Random Keys Survival ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file "$NOTES_FILE"
