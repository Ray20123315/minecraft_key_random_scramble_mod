name: Normalize Historical Release Schema

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-historical-release-schema.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize historical Release bodies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          
          repo = os.environ["REPO"]
          
          def gh_json(endpoint):
              out = subprocess.check_output(["gh", "api", endpoint], text=True)
              return json.loads(out)
          
          def patch_release(release_id, body):
              payload = json.dumps({"body": body}, ensure_ascii=False).encode("utf-8")
              subprocess.run(
                  ["gh", "api", "--method", "PATCH", f"repos/{repo}/releases/{release_id}", "--input", "-"],
                  input=payload,
                  check=True,
              )
          
          languages = [
              ("## 繁體中文", "### 新增功能", "### 修復", "- 無可從原 Release 說明確認的獨立新增功能。", "- 無可從原 Release 說明確認的獨立修復項目。"),
              ("## 简体中文", "### 新增功能", "### 修复", "- 无法从原 Release 说明确认独立新增功能。", "- 无法从原 Release 说明确认独立修复项目。"),
              ("## English", "### Added", "### Fixed", "- No separately documented added feature can be confirmed from the original Release notes.", "- No separately documented fix can be confirmed from the original Release notes."),
          ]
          
          fixed_terms = {
              "## 繁體中文": ("修復", "修正", "避免", "防止", "不再", "排除", "自動修正", "清除按住", "無效", "錯誤", "問題"),
              "## 简体中文": ("修复", "修正", "避免", "防止", "不再", "排除", "自动修正", "清除按住", "无效", "错误", "问题"),
              "## English": ("fix", "correct", "prevent", "no longer", "exclude", "sanitize", "invalid", "bug", "issue", "stuck"),
          }
          
          def section_lines(body, heading):
              lines = body.splitlines()
              try:
                  start = next(i for i, line in enumerate(lines) if line.strip() == heading) + 1
              except StopIteration:
                  return []
              end = len(lines)
              for i in range(start, len(lines)):
                  if lines[i].startswith("## "):
                      end = i
                      break
              return lines[start:end]
          
          def existing_categories(lines, add_heading, fix_heading):
              added, fixed = [], []
              bucket = None
              for raw in lines:
                  line = raw.strip()
                  if line == add_heading:
                      bucket = added
                      continue
                  if line == fix_heading:
                      bucket = fixed
                      continue
                  if line.startswith("### "):
                      bucket = None
                      continue
                  if line.startswith("- ") and bucket is not None:
                      bucket.append(line)
              return added, fixed
          
          def classify(lines, lang_heading):
              bullets = [line.strip() for line in lines if line.strip().startswith("- ")]
              added, fixed = [], []
              terms = fixed_terms[lang_heading]
              for bullet in bullets:
                  hay = bullet.casefold()
                  if any(term.casefold() in hay for term in terms):
                      fixed.append(bullet)
                  else:
                      added.append(bullet)
              return added, fixed
          
          def normalize(body):
              chunks = []
              for lang_heading, add_heading, fix_heading, none_added, none_fixed in languages:
                  lines = section_lines(body, lang_heading)
                  existing_added, existing_fixed = existing_categories(lines, add_heading, fix_heading)
                  if existing_added or existing_fixed:
                      added, fixed = existing_added, existing_fixed
                  else:
                      added, fixed = classify(lines, lang_heading)
                  if not added:
                      added = [none_added]
                  if not fixed:
                      fixed = [none_fixed]
                  chunks.extend([
                      lang_heading,
                      "",
                      add_heading,
                      *added,
                      "",
                      fix_heading,
                      *fixed,
                      "",
                  ])
              return "\n".join(chunks).rstrip() + "\n"
          
          required = [
              "## 繁體中文", "### 新增功能", "### 修復",
              "## 简体中文", "### 新增功能", "### 修复",
              "## English", "### Added", "### Fixed",
          ]
          
          latest = gh_json(f"repos/{repo}/releases/latest")
          latest_id = latest["id"]
          releases = gh_json(f"repos/{repo}/releases?per_page=100")
          changed = []
          for release in releases:
              if release["id"] == latest_id:
                  continue
              old = release.get("body") or ""
              new = normalize(old)
              patch_release(release["id"], new)
              changed.append(release["tag_name"])
          
          # Read back every historical release and require exact heading order.
          verified = gh_json(f"repos/{repo}/releases?per_page=100")
          for release in verified:
              if release["id"] == latest_id:
                  continue
              body = release.get("body") or ""
              headings = [line.strip() for line in body.splitlines() if line.startswith("## ") or line.startswith("### ")]
              if headings != required:
                  raise SystemExit(f"Schema verification failed for {release['tag_name']}: {headings}")
          
          print("Normalized historical releases:")
          for tag in changed:
              print(f" - {tag}")
          print(f"Verified {len(changed)} historical releases; latest {latest['tag_name']} intentionally unchanged.")
          PY
