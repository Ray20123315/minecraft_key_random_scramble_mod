name: Staging v0.4.0

on:
  push:
    branches: [chatgpt-world-state-v0.4.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build ${{ matrix.loader }}
        run: gradle -p ${{ matrix.loader }} clean build --stacktrace
