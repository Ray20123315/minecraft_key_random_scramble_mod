name: Normalize Historical Release Notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-historical-release-notes.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite historical release notes as zh-TW / zh-CN / English
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"

          cat > "$tmp" <<'EOF'
          ## 繁體中文
          - Minecraft Java 1.20.1，提供 Fabric 與 Forge 版本。
          - 每次受傷只改變 1 個已啟用的按鍵映射。
          - 隨機結果限制為常見 PC 鍵，另外包含明確允許的小鍵盤鍵與 `未指定`；舊配置中的無效／不常見 GLFW 鍵值會被修正。
          - 亂鍵配置在重新連線後持續保存，並每 3 分鐘在玩家間輪換。
          - 禁止使用滑鼠滾輪切換快捷欄。
          - 非生存模式需透過 `/!c` 維護模式暫時解鎖。
          - `keepInventory` 強制關閉。
          - 包含繁體中文 `zh_tw`、簡體中文 `zh_cn`、英文 `en_us` 語系。

          ## 简体中文
          - Minecraft Java 1.20.1，提供 Fabric 与 Forge 版本。
          - 每次受伤只改变 1 个已启用的按键映射。
          - 随机结果限制为常见 PC 键，另外包含明确允许的小键盘键与 `未指定`；旧配置中的无效／不常见 GLFW 键值会被修正。
          - 乱键配置在重新连接后持续保存，并每 3 分钟在玩家间轮换。
          - 禁止使用鼠标滚轮切换快捷栏。
          - 非生存模式需要通过 `/!c` 维护模式临时解锁。
          - `keepInventory` 强制关闭。
          - 包含繁体中文 `zh_tw`、简体中文 `zh_cn`、英文 `en_us` 语言文件。

          ## English
          - Minecraft Java 1.20.1 with Fabric and Forge builds.
          - Each damage event changes one enabled key mapping.
          - Random results are restricted to common PC keys, plus explicitly allowed numpad keys and `Unbound`; invalid or uncommon legacy GLFW values are sanitized.
          - Scrambled layouts persist across reconnects and rotate between players every 3 minutes.
          - Mouse-wheel hotbar switching is blocked.
          - Non-Survival modes require the `/!c` maintenance bypass.
          - `keepInventory` is forced off.
          - Includes `zh_tw`, `zh_cn`, and `en_us` localization.
          EOF
          for tag in v0.3.1-build.12 v0.3.1-build.13 v0.3.1-build.14; do
            gh release edit "$tag" --repo "$GH_REPO" --notes-file "$tmp"
          done

          cat > "$tmp" <<'EOF'
          ## 繁體中文
          - Minecraft Java 1.20.1，提供 Fabric 與 Forge 版本。
          - 每次受傷只改變 1 個已啟用的按鍵映射。
          - 小鍵盤按鍵與 `未指定` 都可能成為隨機結果。
          - 亂鍵配置在重新連線後持續保存，並每 3 分鐘在玩家間輪換。
          - 禁止使用滑鼠滾輪切換快捷欄。
          - 非生存模式需透過 `/!c` 維護模式暫時解鎖。
          - `keepInventory` 強制關閉。
          - 包含繁體中文 `zh_tw`、簡體中文 `zh_cn`、英文 `en_us` 語系。
          - HUD 使用右上角雙欄配置；與原始鍵位相同顯示綠色，不同顯示紅色。

          ## 简体中文
          - Minecraft Java 1.20.1，提供 Fabric 与 Forge 版本。
          - 每次受伤只改变 1 个已启用的按键映射。
          - 小键盘按键与 `未指定` 都可能成为随机结果。
          - 乱键配置在重新连接后持续保存，并每 3 分钟在玩家间轮换。
          - 禁止使用鼠标滚轮切换快捷栏。
          - 非生存模式需要通过 `/!c` 维护模式临时解锁。
          - `keepInventory` 强制关闭。
          - 包含繁体中文 `zh_tw`、简体中文 `zh_cn`、英文 `en_us` 语言文件。
          - HUD 使用右上角双栏布局；与原始键位相同显示绿色，不同显示红色。

          ## English
          - Minecraft Java 1.20.1 with Fabric and Forge builds.
          - Each damage event changes one enabled key mapping.
          - Numpad keys and `Unbound` are valid random results.
          - Scrambled layouts persist across reconnects and rotate between players every 3 minutes.
          - Mouse-wheel hotbar switching is blocked.
          - Non-Survival modes require the `/!c` maintenance bypass.
          - `keepInventory` is forced off.
          - Includes `zh_tw`, `zh_cn`, and `en_us` localization.
          - The HUD uses two columns at the upper-right; original bindings are green and changed bindings are red.
          EOF
          gh release edit v0.3.1-build.11 --repo "$GH_REPO" --notes-file "$tmp"

          cat > "$tmp" <<'EOF'
          ## 繁體中文
          - Minecraft Java 1.20.1，提供 Fabric 與 Forge 版本。
          - 每次受傷只改變 1 個已啟用的按鍵映射。
          - 小鍵盤按鍵與 `未指定` 都可能成為隨機結果。
          - 亂鍵配置在重新連線後持續保存，並每 3 分鐘在玩家間輪換。
          - 禁止使用滑鼠滾輪切換快捷欄。
          - 非生存模式需透過 `/!c` 維護模式暫時解鎖。
          - `keepInventory` 強制關閉。
          - 包含繁體中文 `zh_tw`、簡體中文 `zh_cn`、英文 `en_us` 語系。

          ## 简体中文
          - Minecraft Java 1.20.1，提供 Fabric 与 Forge 版本。
          - 每次受伤只改变 1 个已启用的按键映射。
          - 小键盘按键与 `未指定` 都可能成为随机结果。
          - 乱键配置在重新连接后持续保存，并每 3 分钟在玩家间轮换。
          - 禁止使用鼠标滚轮切换快捷栏。
          - 非生存模式需要通过 `/!c` 维护模式临时解锁。
          - `keepInventory` 强制关闭。
          - 包含繁体中文 `zh_tw`、简体中文 `zh_cn`、英文 `en_us` 语言文件。

          ## English
          - Minecraft Java 1.20.1 with Fabric and Forge builds.
          - Each damage event changes one enabled key mapping.
          - Numpad keys and `Unbound` are valid random results.
          - Scrambled layouts persist across reconnects and rotate between players every 3 minutes.
          - Mouse-wheel hotbar switching is blocked.
          - Non-Survival modes require the `/!c` maintenance bypass.
          - `keepInventory` is forced off.
          - Includes `zh_tw`, `zh_cn`, and `en_us` localization.
          EOF
          gh release edit v0.3.0-build.10 --repo "$GH_REPO" --notes-file "$tmp"

          cat > "$tmp" <<'EOF'
          ## 繁體中文
          - Minecraft Java 1.20.1，提供 Fabric 與 Forge 版本。
          - 每次受傷只改變 1 個已啟用的按鍵映射。
          - 亂鍵配置在重新連線後持續保存，並每 3 分鐘在玩家間輪換。
          - 非生存模式需透過 `/!c` 維護模式暫時解鎖。
          - `keepInventory` 強制關閉。

          ## 简体中文
          - Minecraft Java 1.20.1，提供 Fabric 与 Forge 版本。
          - 每次受伤只改变 1 个已启用的按键映射。
          - 乱键配置在重新连接后持续保存，并每 3 分钟在玩家间轮换。
          - 非生存模式需要通过 `/!c` 维护模式临时解锁。
          - `keepInventory` 强制关闭。

          ## English
          - Minecraft Java 1.20.1 with Fabric and Forge builds.
          - Each damage event changes one enabled key mapping.
          - Scrambled layouts persist across reconnects and rotate between players every 3 minutes.
          - Non-Survival modes require the `/!c` maintenance bypass.
          - `keepInventory` is forced off.
          EOF
          for tag in v0.2.0-build.4 v0.2.0-build.5 v0.2.0-build.7; do
            gh release edit "$tag" --repo "$GH_REPO" --notes-file "$tmp"
          done

          rm -f "$tmp"
